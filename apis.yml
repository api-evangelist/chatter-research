aid: chatter-research
name: Chatter Research
description: Chatter Research (now Chatter by Stingray) is a customer feedback and experience
  management platform built for modern retailers. It engages shoppers in AI-driven conversational
  text-message and QR-code surveys that deliver higher response rates and real-time feedback,
  then uses the Stingray-Chatter AI (trained on 7000+ retail topics) to categorize free-text
  replies into topics and sentiment. Role-based dashboards surface NPS/CSAT, benchmarks, topic
  explorers, and NPS boosters so store teams can save lost sales, drive loyalty enrollment, and
  generate online reviews. Founded in 2016 and acquired by Stingray, the company is a former
  500 Global portfolio company. The product is a SaaS dashboard with a help center and CSV data
  exports; it publishes no public developer API at this time.
